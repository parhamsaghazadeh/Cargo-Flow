server:
  port: 8082

spring:
  application:
    name: truck-service
  datasource:
    url: jdbc:h2:mem:truckservice
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.cargoflow.truckservice: DEBUG
    org.springframework.web: DEBUG
